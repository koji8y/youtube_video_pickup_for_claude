version: "1.2"
cache: true

interface:
  agents: false

endpoints:
  anthropic:
    apiKey: "${ANTHROPIC_API_KEY}"
    systemPrompt: "ユーザーが YouTube の URL を含むメッセージを送った場合は、必ず get_youtube_transcript ツールを呼び出してトランスクリプトを取得し、その内容を要約すること。"
    models:
      - claude-fable-5
      - claude-opus-5-5
      - claude-opus-5
      - claude-sonnet-5
      - claude-sonnet-4-6
      - claude-opus-4-8
      - claude-haiku-4-5-20251001

# LibreChat has an unresolved bug where Extended Thinking combined with MCP
# tool calls drops the thinking block content on the follow-up request,
# causing Anthropic to reject it with "content.0.thinking.thinking: Field
# required" (https://github.com/danny-avila/LibreChat/issues/12717). Since
# this app always triggers the youtube-transcript tool, thinking is pinned
# off here to avoid it on models that allow disabling it.
#
# The Claude 5 generation (fable-5/opus-5/sonnet-5) uses adaptive thinking
# instead and is on by default with no config needed; Claude Fable 5 flatly
# rejects thinking:{type:"disabled"} with a 400, so `thinking: false` is
# deliberately omitted for these three models.
#
# LibreChat v0.8.7's built-in token map has no entry for claude-opus-5-5 /
# claude-opus-5 / claude-sonnet-5, so they match the generic "claude-" key
# (100K). Subtracting the 128K max output leaves nothing and the context
# falls back to 1024 tokens ("empty_messages"). The real limits (1M / 128K)
# are therefore set explicitly on those presets.
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: claude-fable-5-1
      label: "Claude Fable 5.1"
      preset:
        endpoint: anthropic
        model: claude-fable-5-1
    - name: claude-fable-5
      label: "Claude Fable 5"
      preset:
        endpoint: anthropic
        model: claude-fable-5
    - name: claude-opus-5-5
      label: "Claude Opus 5.5"
      preset:
        endpoint: anthropic
        model: claude-opus-5-5
        maxContextTokens: 1000000
        maxOutputTokens: 128000
    - name: claude-opus-5
      label: "Claude Opus 5"
      preset:
        endpoint: anthropic
        model: claude-opus-5
        maxContextTokens: 1000000
        maxOutputTokens: 128000
    - name: claude-sonnet-5
      label: "Claude Sonnet 5"
      preset:
        endpoint: anthropic
        model: claude-sonnet-5
        maxContextTokens: 1000000
        maxOutputTokens: 128000
        thinking: false
    - name: claude-opus-4-8
      label: "Claude Opus 4.8"
      preset:
        endpoint: anthropic
        model: claude-opus-4-8
        thinking: false
    - name: claude-sonnet-4-6
      label: "Claude Sonnet 4.6"
      preset:
        endpoint: anthropic
        model: claude-sonnet-4-6
        thinking: false
    - name: claude-haiku-4-5-20251001
      label: "Claude Haiku 4.5"
      preset:
        endpoint: anthropic
        model: claude-haiku-4-5-20251001
        thinking: false

mcpSettings:
  allowedDomains:
    - http://mcp-youtube:8080

mcpServers:
  youtube-transcript:
    url: http://mcp-youtube:8080/sse
    type: sse
